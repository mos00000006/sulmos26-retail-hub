
name: Deploy SULMOS26 POS (Separate Worker)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sulmos26-pos-production
  cancel-in-progress: false

jobs:
  deploy-pos:
    name: Deploy SULMOS26 Red POS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check application
        run: npm run check

      - name: Verify POS files exist
        run: |
          test -f public-pos/index.html
          test -f public-pos/app.js
          test -f public-pos/styles.css
          test -f .github/scripts/prepare-pos-deploy.mjs

      - name: Prepare separate POS Worker
        env:
          SULMOS26_D1_DATABASE_ID: ${{ secrets.SULMOS26_D1_DATABASE_ID }}
        run: node .github/scripts/prepare-pos-deploy.mjs

      - name: Deploy red POS to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.pos.deploy.jsonc

      - name: Deployment summary
        run: |
          echo "### SULMOS26 POS" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: sulmos26-pos" >> "$GITHUB_STEP_SUMMARY"
          echo "Check Cloudflare Workers & Pages for the live URL." >> "$GITHUB_STEP_SUMMARY"
