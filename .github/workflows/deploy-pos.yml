
name: Deploy SULMOS26 POS (Separate Worker)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sulmos26-pos-production
  cancel-in-progress: false

jobs:
  deploy-pos:
    name: Deploy SULMOS26 Red POS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check application
        run: npm run check

      - name: Verify Cloudflare configuration
        env:
          DATABASE_ID: ${{ secrets.SULMOS26_D1_DATABASE_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$DATABASE_ID" ]; then
            echo "::error::SULMOS26_D1_DATABASE_ID is empty or unavailable. Check Repository secrets."
            exit 1
          fi

          if ! [[ "$DATABASE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Database ID must be a Cloudflare D1 UUID. Update the GitHub secret."
            exit 1
          fi

          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Cloudflare API token or account ID is missing."
            exit 1
          fi

          echo "Cloudflare configuration validated."

      - name: Prepare separate POS Worker
        env:
          SULMOS26_D1_DATABASE_ID: ${{ secrets.SULMOS26_D1_DATABASE_ID }}
        run: node .github/scripts/prepare-pos-deploy.mjs

      - name: Deploy Red POS to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.pos.deploy.jsonc

      - name: Deployment completed
        run: |
          echo "### SULMOS26 POS Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: sulmos26-pos" >> "$GITHUB_STEP_SUMMARY"
          echo "Open Cloudflare Workers & Pages and click Visit." >> "$GITHUB_STEP_SUMMARY"

  
