<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071a24">
  <meta name="description" content="SULMOS26 — Your business. One system.">
  <title>SULMOS26 HUB</title>
  <link rel="icon" href="/assets/sulmos26-mark.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <div class="boot"><img src="/assets/sulmos26-logo.png" alt="SULMOS26"><p>Preparing your workspace…</p></div>
  </div>
  <script>
    window.addEventListener('error', function(event) {
      var app = document.getElementById('app');
      if (!app || !app.textContent.includes('Preparing your workspace')) return;
      var detail = event.message || 'Application script failed to load.';
      app.innerHTML = '<div style="font:16px Arial,sans-serif;padding:60px 24px;text-align:center">' +
        '<h2>SULMOS26 could not start</h2><p id="startup-detail"></p>' +
        '<button onclick="location.reload()" style="padding:12px 24px">Retry</button></div>';
      document.getElementById('startup-detail').textContent = detail;
    }, true);
  </script>
  <script src="/app.js?v=green-recovery-v22" type="module"></script>
</body>
</html>
